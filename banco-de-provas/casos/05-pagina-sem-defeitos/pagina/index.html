<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caso 05: contato</title>
<style>
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.5; color: #1a1a1a; background: #ffffff; }
  header, main, footer { max-width: 40rem; margin: 0 auto; padding: 1rem; box-sizing: border-box; }
  nav ul { list-style: none; display: flex; flex-wrap: wrap; gap: 8px 16px; padding: 0; margin: 0; }
  nav a { display: inline-block; padding: 12px 4px; color: #0645ad; }
  a { color: #0645ad; }
  :focus-visible { outline: 3px solid #1a1a1a; outline-offset: 2px; }
  label { display: block; margin-top: 16px; font-weight: 700; }
  .dica { display: block; color: #595959; font-weight: 400; font-size: 14px; }
  input, textarea { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; padding: 10px; font-size: 16px; border: 2px solid #595959; border-radius: 4px; }
  button { margin-top: 20px; padding: 12px 24px; font-size: 16px; color: #ffffff; background: #1a5fb4; border: 0; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <nav aria-label="Principal">
    <ul>
      <li><a href="#inicio">Início</a></li>
      <li><a href="#servicos">Serviços</a></li>
      <li><a href="#contato" aria-current="page">Contato</a></li>
    </ul>
  </nav>
</header>
<main>
  <h1>Fale com a gente</h1>
  <p>Respondemos em até dois dias úteis.</p>
  <form action="#" id="contato">
    <label for="nome">Nome</label>
    <input id="nome" name="nome" autocomplete="name" required>
    <label for="email">E-mail <span class="dica">Usamos só para responder.</span></label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label for="mensagem">Mensagem</label>
    <textarea id="mensagem" name="mensagem" rows="5" required></textarea>
    <button type="submit">Enviar mensagem</button>
  </form>
  <p id="retorno" role="status"></p>
</main>
<footer>
  <p><a href="#privacidade">Política de privacidade</a></p>
</footer>
<script>
  document.getElementById('contato').addEventListener('submit', (e) => {
    e.preventDefault();
    document.getElementById('retorno').textContent = 'Mensagem recebida. Obrigado.';
  });
</script>
</body>
</html>
